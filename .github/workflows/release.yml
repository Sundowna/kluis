name: Release
# Push a tag like v0.3.0 -> tests run, the .deb is built and attached to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0
      - name: Run tests
        run: |
          python3 tests/test_engine.py
          python3 tests/test_photos.py
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "Kluis ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md
