name: Release
# Bump VERSION in kluis/__init__.py and push to main -> tests run, the .deb is built,
# and a release vX.Y.Z is published with it (once per version).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0
      - name: Run tests
        run: |
          python3 tests/test_engine.py
          python3 tests/test_photos.py
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Publish release (only if this version is new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(python3 -c 'import kluis; print(kluis.VERSION)')"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V already exists; nothing to publish."
          else
            gh release create "$V" dist/*.deb --target "$GITHUB_SHA" \
              --title "Kluis ${V#v}" --notes-file packaging/release-notes.md
          fi
