name: Release
# Every push and pull request: all test suites + the GUI flows F1–F24 (light/dark, 1440x900 and 1024x640)
# on Mint-like Ubuntu (Cinnamon session variables) and on Arch (KDE session variables), then both packages
# are built, installed, started and uninstalled. A push to main with a new VERSION publishes vX.Y.Z once.
on:
  push:
    branches: [main, redesign-1.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Linux Mint (Ubuntu ${{ matrix.ubuntu }}) package
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "22.04"]       # Mint 22 and Mint 21.3 bases
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi python3-gi-cairo librsvg2-common gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb dbus-x11 \
            imagemagick tzdata libsecret-1-0 gir1.2-secret-1 at-spi2-core
      - name: Unit, engine, photo and safety tests
        run: |
          python3 tests/test_lint.py
          python3 tests/test_engine.py
          python3 tests/test_photos.py
          python3 tests/test_safety.py
          python3 tests/test_units.py
      - name: GUI flows F1–F24 (Cinnamon)
        if: matrix.ubuntu == '24.04'
        run: TZ=Europe/Zurich tests/gui/run_all.sh dist/flows-mint X-Cinnamon
      - name: Photos with 50'000 items (frame time, memory)
        run: xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- python3 tests/gui/perf_photos.py
      - name: Build, install, start and remove the .deb
        run: |
          packaging/build-deb.sh
          sudo apt-get install -y -q ./dist/kluis_*_all.deb
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c \
            'KLUIS_DEBUG=1 kluis & sleep 10; import -window root dist/mint-${{ matrix.ubuntu }}.png; kill -0 $! && echo "Kluis is running"'
          kluis --version
          sudo apt-get remove -y -q kluis && test ! -e /usr/bin/kluis
          sudo apt-get install -y -q ./dist/kluis_*_all.deb && sudo apt-get purge -y -q kluis && test ! -e /usr/lib/kluis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-${{ matrix.ubuntu }}
          path: dist/

  arch:
    name: Arch / EndeavourOS (KDE) package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools and dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python python-gobject python-cairo gtk3 librsvg gdk-pixbuf2 libsecret \
            libayatana-appindicator gnome-keyring xorg-server-xvfb xorg-xauth dbus imagemagick ttf-dejavu \
            adwaita-icon-theme tzdata at-spi2-core which
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          python3 tests/test_lint.py
          python3 tests/test_engine.py
          python3 tests/test_photos.py
          python3 tests/test_safety.py
          python3 tests/test_units.py
      - name: GUI flows F1–F24 (KDE)
        run: |
          useradd -m tester && chown -R tester "$PWD"
          su tester -c "TZ=Europe/Zurich tests/gui/run_all.sh dist/flows-kde KDE"
      - name: Build package with makepkg
        run: |
          V="$(python3 -c 'import kluis; print(kluis.VERSION)')"
          grep -q "^pkgver=$V$" packaging/arch/PKGBUILD || { echo "PKGBUILD pkgver must be $V"; exit 1; }
          git config --global --add safe.directory "$PWD"
          mkdir -p /tmp/build && cp packaging/arch/PKGBUILD /tmp/build/
          sed -i "s|^source=.*|source=(\"kluis-$V.tar.gz\")|" /tmp/build/PKGBUILD
          git archive --prefix="kluis-$V/" -o "/tmp/build/kluis-$V.tar.gz" HEAD
          useradd -m builder && chown -R builder /tmp/build
          su builder -c "cd /tmp/build && makepkg --nodeps --noconfirm"
          mkdir -p dist && cp /tmp/build/*.pkg.tar.zst dist/
      - name: Install, start and remove with pacman
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          pacman -Qi kluis | sed -n '1,4p'
          python3 -c "import gi; gi.require_version('AyatanaAppIndicator3','0.1'); print('panel icon library ok')"
          XDG_CURRENT_DESKTOP=KDE xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c \
            'KLUIS_DEBUG=1 kluis & sleep 10; import -window root dist/arch-kde.png; kill -0 $! && echo "Kluis is running"'
          pacman -R --noconfirm kluis && test ! -e /usr/bin/kluis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch
          path: dist/

  release:
    needs: [deb, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{deb-24.04,arch}"
          path: dist
          merge-multiple: true
      - name: Publish release (only if this version is new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(python3 -c 'import kluis; print(kluis.VERSION)')"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V already exists; nothing to publish."
            exit 0
          fi
          cd dist
          cp kluis_*_all.deb kluis_latest_all.deb
          cp kluis-*-any.pkg.tar.zst kluis-latest-any.pkg.tar.zst
          gh release create "$V" kluis_*.deb kluis-*.pkg.tar.zst --target "$GITHUB_SHA" \
            --title "Kluis ${V#v}" --notes-file ../packaging/release-notes.md
